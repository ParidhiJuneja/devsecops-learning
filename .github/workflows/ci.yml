name: DevSecOps CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: GitGuardian Secret Scan
        uses: GitGuardian/ggshield/actions/secret@v1.51.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
      - name: Snyk SCA Scan
        uses: snyk/actions/python@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - name: Package application
        run: |
          zip -r app-package-${{ github.run_number }}.zip app requirements.txt -x "app/__pycache__/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package-${{ github.run_number }}
          path: app-package-${{ github.run_number }}.zip

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package-${{ github.run_number }}
          path: staging
      - name: Extract artifact
        run: |
          unzip -o staging/app-package-${{ github.run_number }}.zip -d staging/deployed

      - name: Deploy to staging
        run: |
          echo "Deploying application to staging..."
          ls -R staging

      - name: Staging smoke test
        run: |
          test -f staging/deployed/app/app.py
          test -f staging/deployed/requirements.txt
          echo "Staging smoke test passed"
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package-${{ github.run_number }}
          path: production

      - name: Extract artifact
        run: |
          unzip -o production/app-package-${{ github.run_number }}.zip -d production/deployed

      - name: Deploy to production
        run: |
          echo "Deploying application to production..."
          ls -R production

      - name: Production smoke test
        run: |
          test -f production/deployed/app/app.py
          test -f production/deployed/requirements.txt
          echo "Production deployment successful"


